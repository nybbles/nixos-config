# Wallust theme template for tmux
# Generated by wallust from color palette

# Wallust colors - mapped to semantic tmux usage
thm_bg="{{background}}"
thm_fg="{{foreground}}"
thm_cyan="{{color6}}"
thm_black="{{color0}}"
thm_gray="{{color8}}"
thm_magenta="{{color5}}"
thm_pink="{{color13}}"
thm_red="{{color1}}"
thm_green="{{color2}}"
thm_yellow="{{color3}}"
thm_blue="{{color4}}"
thm_orange="{{color9}}"
thm_black4="{{color8}}"

# status
set -g status-position bottom
set -g status-bg "${thm_bg}"
set -g status-fg "${thm_fg}"
set -g status-left-length 100
set -g status-right-length 100

# messages
set -g message-style "fg=${thm_cyan},bg=${thm_gray},align=centre"
set -g message-command-style "fg=${thm_cyan},bg=${thm_gray},align=centre"

# panes
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

# Enhanced pane visibility
set -g pane-border-lines heavy           # Thicker borders
set -g pane-border-indicators both       # Arrow indicators on active pane

# Dim inactive panes to make active pane pop
set -g window-style "fg=${thm_gray},bg=${thm_black}"
set -g window-active-style "fg=${thm_fg},bg=${thm_bg}"

# windows
setw -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg},none"
setw -g window-status-separator ""
setw -g window-status-style "fg=${thm_fg},bg=${thm_bg},none"

# status left
set -g status-left ""

# status right
set -g status-right "#{continuum_status} #[fg=${thm_pink},bg=${thm_bg},nobold,nounderscore,noitalics]#[fg=${thm_bg},bg=${thm_pink},nobold,nounderscore,noitalics] #[fg=${thm_fg},bg=${thm_gray}] #W #{?client_prefix,#[fg=${thm_red}],#[fg=${thm_green}]}#[bg=${thm_gray}]#{?client_prefix,#[bg=${thm_red}],#[bg=${thm_green}]}#[fg=${thm_bg}] #[fg=${thm_fg},bg=${thm_gray}] #S "

# window current format
setw -g window-status-current-format "#[fg=${thm_bg},bg=${thm_orange}]#[fg=${thm_fg},bg=${thm_orange}] #I #[fg=${thm_fg},bg=${thm_orange},bold] #W#{?window_zoomed_flag,(),} #[fg=${thm_orange},bg=${thm_bg}]"

# window format
setw -g window-status-format "#[fg=${thm_fg},bg=${thm_bg}] #I #[fg=${thm_fg},bg=${thm_bg}] #W "

# tmux-plugins/tmux-prefix-highlight support
set -g @prefix_highlight_output_prefix "#[fg=${thm_yellow}]#[bg=${thm_bg}]#[fg=${thm_bg}]#[bg=${thm_yellow}]"
set -g @prefix_highlight_output_suffix ""
