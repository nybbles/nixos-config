# Wallust theme template for lazygit
# Generated by wallust from color palette

gui:
  nerdFontsVersion: "3"
  theme:
    # Selection colors
    selectedLineBgColor:
      - "{{color8}}"
    selectedRangeBgColor:
      - "{{color8}}"
    # Border colors
    activeBorderColor:
      - "{{color4}}"
      - bold
    inactiveBorderColor:
      - "{{color8}}"
    searchingActiveBorderColor:
      - "{{color3}}"
    # Text colors
    optionsTextColor:
      - "{{color4}}"
    # Cherry pick colors
    cherryPickedCommitBgColor:
      - "{{color5}}"
    cherryPickedCommitFgColor:
      - "{{background}}"
    # Unstaged changes
    unstagedChangesColor:
      - "{{color1}}"
    # Default foreground
    defaultFgColor:
      - "{{foreground}}"

git:
  paging:
    colorArg: always
    pager: delta --paging=never
