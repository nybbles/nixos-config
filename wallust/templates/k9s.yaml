    fgColor: "{{foreground}}"
    bgColor: "{{background}}"
    logoColor: "{{color5}}"

  prompt:
    fgColor: "{{foreground}}"
    bgColor: "{{background}}"
    suggestColor: "{{color8}}"

  info:
    fgColor: "{{color6}}"
    sectionColor: "{{foreground}}"

  dialog:
    fgColor: "{{foreground}}"
    bgColor: "{{background}}"
    buttonFgColor: "{{foreground}}"
    buttonBgColor: "{{color5}}"
    buttonFocusFgColor: "{{color3}}"
    buttonFocusBgColor: "{{color13}}"
    labelFgColor: "{{color9}}"
    fieldFgColor: "{{foreground}}"

  frame:
    border:
      fgColor: "{{color8}}"
      focusColor: "{{color8}}"

    menu:
      fgColor: "{{foreground}}"
      keyColor: "{{color5}}"
