# Wallust theme template for Alacritty
# Generated by wallust from color palette

# Font configuration
[font]
size = 14.0

[font.normal]
family = "0xProto Nerd Font"
style = "Regular"

[font.bold]
family = "0xProto Nerd Font"
style = "Bold"

[font.italic]
family = "0xProto Nerd Font"
style = "Italic"

# General settings
[general]
live_config_reload = true

[window]
decorations = "full"

[window.padding]
x = 6
y = 6

# Colors from wallust
[colors.primary]
background = "{{background}}"
foreground = "{{foreground}}"
dim_foreground = "{{color8}}"
bright_foreground = "{{foreground}}"

[colors.cursor]
text = "{{background}}"
cursor = "{{cursor}}"

[colors.vi_mode_cursor]
text = "{{background}}"
cursor = "{{color4}}"

[colors.search.matches]
foreground = "{{background}}"
background = "{{color7}}"

[colors.search.focused_match]
foreground = "{{background}}"
background = "{{color2}}"

[colors.footer_bar]
foreground = "{{background}}"
background = "{{color7}}"

[colors.hints.start]
foreground = "{{background}}"
background = "{{color3}}"

[colors.hints.end]
foreground = "{{background}}"
background = "{{color7}}"

[colors.selection]
text = "{{background}}"
background = "{{cursor}}"

[colors.normal]
black = "{{color0}}"
red = "{{color1}}"
green = "{{color2}}"
yellow = "{{color3}}"
blue = "{{color4}}"
magenta = "{{color5}}"
cyan = "{{color6}}"
white = "{{color7}}"

[colors.bright]
black = "{{color8}}"
red = "{{color9}}"
green = "{{color10}}"
yellow = "{{color11}}"
blue = "{{color12}}"
magenta = "{{color13}}"
cyan = "{{color14}}"
white = "{{color15}}"
