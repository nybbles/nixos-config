# ============================================================================
# TPM (Tmux Plugin Manager) Configuration
# ============================================================================
# This file is tracked in git and contains all tmux plugin declarations.
# It's sourced by ~/.tmux.conf (which is managed by themester for themes).
#
# To install/update plugins: Ctrl+a I (capital I)
# To remove plugins: Remove the @plugin line, reload config, then Ctrl+a Alt+u

# ============================================================================
# Plugin Declarations
# ============================================================================

# TPM itself
set -g @plugin 'tmux-plugins/tpm'

# tmux-which-key - Keyboard shortcuts menu (replaces old Nix package)
# Press Ctrl+a Space to show menu
set -g @plugin 'alexwforsythe/tmux-which-key'

# Navigation plugins
set -g @plugin 'christoomey/vim-tmux-navigator'  # Seamless vim-tmux pane navigation
set -g @plugin 'tmux-plugins/tmux-yank'          # Copy to system clipboard

# Content extraction and search
set -g @plugin 'laktak/extrakto'                 # Fuzzy search pane content (Ctrl+a Tab)
set -g @plugin 'wfxr/tmux-fzf-url'              # Open URLs from tmux with fzf

# Enhanced fuzzy finding
set -g @plugin 'sainnhe/tmux-fzf'                # Tmux command fuzzy finder

# ============================================================================
# Plugin Configuration
# ============================================================================

# tmux-which-key configuration
set -g @tmux-which-key-xdg-enable 1              # Use XDG config directory
set -g @tmux-which-key-disable-autoupdate on     # Don't auto-update

# tmux-fzf configuration
set -g @fzf-url-bind 'u'                         # Bind URL opener to 'u'

# ============================================================================
# Initialize TPM
# ============================================================================
# This MUST be at the very end of tmux configuration
run '~/.tmux/plugins/tpm/tpm'
